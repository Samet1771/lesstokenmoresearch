[project]
name = "lesstokenmoresearch"
version = "0.1.0"
description = "Fewer tokens. More search. Local multi-agent web research for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["research", "llm", "agent", "ollama", "searxng", "claude-code", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # http2: browsers speak it, and a client that cannot stands out to the
    # bot protection sitting in front of a fifth of the pages we fetch.
    "httpx[http2]>=0.27",
    "rich>=13.7",
    "textual>=0.60",
    # Boilerplate removal decides how much of a fetched page is signal. The
    # code falls back to a crude tag strip without it, but the quality drop is
    # large enough that this is not really optional.
    "trafilatura>=1.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ltms = "ltms.cli:main"
lesstokenmoresearch = "ltms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ltms"]
